[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhaway-trace"
version = "0.1.0"
description = "Agent observability for Python. Trace LLM calls, track cost/latency/tokens, export to Qhaway HTTP API, OTEL, or local SQLite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Carlos Cortez", email = "carlos@finoptix.dev" }]
keywords = ["observability", "llm", "tracing", "agent", "cost", "otel", "finops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/breakingthecloud/qhaway"
Repository = "https://github.com/breakingthecloud/qhaway"

[project.scripts]
qhaway = "qhaway.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
langchain = ["langchain-core>=0.1", "langchain-openai>=0.1"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.24", "openai>=1.0", "anthropic>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qhaway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
