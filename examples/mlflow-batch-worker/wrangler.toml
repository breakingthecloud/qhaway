name = "qhaway-mlflow-batch"
main = "src/index.ts"
compatibility_date = "2026-07-31"

[[d1_databases]]
binding = "DB"
database_name = "qhaway"
database_id = "YOUR_D1_DATABASE_ID"

[triggers]
crons = ["0 * * * *"]

[vars]
MLFLOW_TRACKING_URI = "http://localhost:5001"
MLFLOW_EXPERIMENT = "qhaway-agent-runs"
